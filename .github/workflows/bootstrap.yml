name: Ninja Lost validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      application: ${{ steps.detect.outputs.application }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/ci/check_repository.py
      - name: Validate private preview config without launching services
        run: bash ops/preview/validate-config.sh
      - id: detect
        run: if [ -f composer.json ]; then echo 'application=true' >> "$GITHUB_OUTPUT"; else echo 'application=false' >> "$GITHUB_OUTPUT"; fi
  runtime:
    needs: hygiene
    if: needs.hygiene.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ninja_lost_eval
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_NAME: Ninja Lost
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ninja_lost_eval
      DB_USERNAME: root
      DB_PASSWORD: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip
          tools: composer:v2
          coverage: none
      - name: Ephemeral application encryption key
        run: |
          key="base64:$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "APP_KEY=$key" >> "$GITHUB_ENV"
      - name: Real MySQL migrations and Filament integration tests
        run: bash ops/runtime/setup-ci.sh
      - name: Strict autoload check
        run: composer dump-autoload --optimize --strict-psr --no-scripts --no-plugins --no-interaction
      - name: Browser interactions and process restart
        run: bash ops/browser/run.sh
      - name: Record scope
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '## MB01 validation\n\nResult: %s\n\nRevision: `%s`\n\nIntegration and browser step results must be read separately. Browser covers Chromium desktop/mobile-sized viewport, login, search, config save and application-process restart. No real phone, persistent preview, gameplay, Discord or Android verification. Screenshots are ephemeral; no artifact upload or persistent cache.\n' "$RESULT" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
