name: Ninja Lost combat data contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: combat-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  content:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ninja_lost_eval
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ninja_lost_eval
      DB_USERNAME: root
      DB_PASSWORD: ''
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip
          tools: composer:v2
          coverage: none
      - name: Decoder catalogue and publication contracts
        run: |
          python3 -m unittest discover -s ops/combat-data -p 'test_*.py' -v
          python3 -m unittest discover -s ops/combat -p 'test_*.py' -v
          node --test ops/combat-data/catalog.test.cjs ops/content-studio/catalog.test.cjs
          find app/Content app/Services/Content app/Evaluation ops/content-studio ops/equipment-studio ops/training ops/trials -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l app/Filament/Pages/ContentStudio.php
          php -l app/Filament/Pages/EquipmentStudio.php
          php -l app/Filament/Pages/MirrorTrials.php
          php -l app/Services/Combat/CombatLoadout.php
          node --check ops/content-studio/browser.cjs
          node --check ops/equipment-studio/browser.cjs
          node --check ops/training/browser.cjs
          node --check public/js/training-client.js
          node --check ops/trials/browser.cjs
          node --check public/js/trial-client.js
          bash -n ops/content-studio/browser.sh
      - name: Pinned read-only metadata and source intake
        env:
          NL_SOURCE_TOKEN: ${{ github.token }}
        run: |
          python3 ops/combat-data/inspect.py "$RUNNER_TEMP/nl-combat-data"
          python3 ops/combat/fetch-source.py "$RUNNER_TEMP/nl-combat-engine"
          echo "NL_COMBAT_DATA=$RUNNER_TEMP/nl-combat-data" >> "$GITHUB_ENV"
          echo "NL_COMBAT_SOURCE=$RUNNER_TEMP/nl-combat-engine" >> "$GITHUB_ENV"
      - name: Real catalogue validation and source-engine skill execution
        run: |
          node ops/combat-data/corpus.cjs
          node --test ops/equipment-studio/stats.test.cjs ops/training/engine.test.cjs
      - name: Ephemeral key
        run: |
          key="base64:$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "APP_KEY=$key" >> "$GITHUB_ENV"
      - name: Existing locked runtime and isolated MySQL
        run: |
          bash ops/runtime/setup-ci.sh > "$RUNNER_TEMP/content-setup.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/content-setup.log"; exit 1; }
          composer dump-autoload --optimize --strict-psr --no-scripts --no-plugins --no-interaction
      - name: Existing DB ownership and engine bridge regression
        run: vendor/bin/phpunit -c ops/combat-data/phpunit.xml --testdox
      - name: Draft release activation rollback and published engine mechanics
        run: vendor/bin/phpunit -c ops/content-studio/phpunit.xml --testdox
      - name: Equipment bundle ownership set bonus and actual source engine
        run: vendor/bin/phpunit -c ops/equipment-studio/phpunit.xml --testdox
      - name: Persisted authoritative training and route gates
        run: |
          vendor/bin/phpunit -c ops/training/phpunit.xml --testdox
          NL_EVALUATION_GATEWAY=false NL_TRAINING=true APP_ENV=local php ops/training/check-gate.php disabled
          NL_EVALUATION_GATEWAY=true NL_TRAINING=false APP_ENV=local php ops/training/check-gate.php disabled
          NL_EVALUATION_GATEWAY=true NL_TRAINING=true APP_ENV=production php ops/training/check-gate.php disabled
          NL_EVALUATION_GATEWAY=true NL_TRAINING=true APP_ENV=local php ops/training/check-gate.php enabled
      - name: Bound mirror outcome shared rewards and additive upgrade
        run: |
          vendor/bin/phpunit -c ops/trials/phpunit.xml --testdox
          NL_EVALUATION_GATEWAY=true NL_TRAINING=true NL_MIRROR_TRIALS=false APP_ENV=local php ops/trials/check-gate.php disabled
          NL_EVALUATION_GATEWAY=false NL_TRAINING=true NL_MIRROR_TRIALS=true APP_ENV=local php ops/trials/check-gate.php disabled
          NL_EVALUATION_GATEWAY=true NL_TRAINING=false NL_MIRROR_TRIALS=true APP_ENV=local php ops/trials/check-gate.php disabled
          NL_EVALUATION_GATEWAY=true NL_TRAINING=true NL_MIRROR_TRIALS=true APP_ENV=production php ops/trials/check-gate.php disabled
          NL_EVALUATION_GATEWAY=true NL_TRAINING=true NL_MIRROR_TRIALS=true APP_ENV=local php ops/trials/check-gate.php enabled
      - name: Concurrent editing publishing and activation
        run: |
          php ops/content-studio/race.php
          php ops/equipment-studio/race.php
      - name: Actual authoring training and reward browser loops
        run: bash ops/content-studio/browser.sh
      - name: Remove owned temporary metadata and record limits
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          rm -rf -- "$RUNNER_TEMP/nl-combat-data" "$RUNNER_TEMP/nl-combat-engine"
          printf '## Content, training and bound mirror trials\nResult: %s\nRevision: `%s`\n\nMirror trials reuse pinned combat and G8C/shared ledger. Standalone training stays reward-free. No arbitrary mission parity, live PvP, native client, assets, production deployment or artifact upload. Visual refactor remains deferred.\n' "$RESULT" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
