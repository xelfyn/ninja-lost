services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    init: true
    working_dir: /workspaces/ninja-lost
    volumes:
      - ..:/workspaces/ninja-lost:cached
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    env_file: .runtime/mysql.env
    volumes:
      - preview_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    # No host port, no public database access.
volumes:
  preview_data:
